# XGBoost + SHAP training settings (edit paths and lists for your environment).
# Paths below are relative to the repository root unless you use an absolute path.

data:
  handler_dir: backtest_2/data
  start_date: "2020-04-06"

# Instrument filters (column names = order_book_id / ticker symbols in your parquet).
# include: if non-empty, only these symbols are kept (others dropped).
# exclude: always removed (applied after include).
stocks:
  include: []
  exclude: []

filters:
  min_value_dollars: 20000000
  min_listing_days: 5
  use_value_filter: true
  use_listing_day_filter: true
  use_opening_limit_filter: true
  use_day_trade_filter: true
  use_non_limit_up_filter: true

# intraday | winsorize_intraday (1–99% global clip) | overnight | day
target: winsorize_intraday

splits:
  train_frac: 0.7
  val_frac: 0.15

# Artifacts go under output.dir/<YYYY-mm-dd_HH-MM-SS>/ (CSVs, PNGs, config_<same-stamp>.yaml snapshot).
output:
  dir: xgb_shap/output

random_state: 42

xgboost:
  n_estimators: 800
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.4    
  min_child_weight: 500
  reg_lambda: 1.0
  n_jobs: -1
  early_stopping_rounds: 80

shap:
  sample: 5000
  background_max: 2000
  # Low-cardinality columns -> "filters"; others -> "factors". Override with manual lists.
  conditional_correlation_threshold: 0.7
  conditional_min_slice_size: 3000
  conditional_max_unique_for_filter: 20
  conditional_filter_columns: []
  conditional_factor_columns: []
  # Role thresholds: primary (|rho|), noise (|rho| cap), anchor (spread of |rho| across states), SHAP "high" bar
  role_primary_abs_rho: 0.7
  role_noise_abs_rho: 0.15
  role_anchor_min_abs_rho_spread: 0.3
  role_high_shap_quantile: 0.5
  # Quantile cuts tested to turn any continuous feature into a binary regime filter
  discretization_scan_strong_abs_rho: 0.7
  discretization_scan_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  # Optional: monotonicity scan only when the anchor lies between two quantiles (inner band), e.g. middle 80%.
  discretization_scan_band_pairs:
    - [0.1, 0.9]
    - [0.25, 0.75]

# Feature columns for XGBoost: eval(expr, funcs_methods, handler)
features:
  - name: Margin_Maintenance_Ratio
    expr: Margin_Maintenance_Ratio
  - name: Turnover_Ratio
    expr: Turnover/ts_mean(Turnover, 20)
  - name: return_rate
    expr: (Close * Adjust_Factor/ts_delay(Close*Adjust_Factor,1) - 1)
  - name: Large_vs_Small_Holder_mean_diff
    expr: ts_mean(Custodied_Greater_Than_1000_Lots_Pct, 21) - ts_mean(Custodied_Under_400_Lots_Pct, 21)

# FAMOSE settings live in xgb_shap/famose/config.yaml (see famose_verify.py).
